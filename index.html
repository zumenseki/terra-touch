<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>terra-touch</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 10px; left: 10px; color: #fff;
      background: rgba(0, 0, 0, .45); padding: 8px 12px; border-radius: 8px;
      font-size: 12px; line-height: 1.6; pointer-events: none; user-select: none;
    }
    #hud b { font-size: 13px; }
  </style>
</head>
<body>
  <div id="hud">
    <b>terra-touch M2</b><br>
    左ドラッグ=地面を彫る / 右ドラッグ=回転 / ホイール=ズーム / 中ドラッグ=移動<br>
    <span id="backend">初期化中…</span> | <span id="fps">-</span> |
    土drift <span id="soil">-</span> | 水 <span id="water">-</span>
  </div>
  <div id="tools">
    <button id="mode-dig" class="on">⛏ 掘る</button>
    <button id="mode-raise">⛰ 盛る</button>
    <button id="src-toggle" class="on">💧 湧水 ON</button>
  </div>
  <style>
    #tools { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; }
    #tools button { font-size: 14px; padding: 8px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.5); color: #eee;
      cursor: pointer; backdrop-filter: blur(4px); }
    #tools button.on { background: #2c7; color: #062; border-color: #2c7; font-weight: 700; }
  </style>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
